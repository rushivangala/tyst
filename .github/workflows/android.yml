name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.TYST_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner image ships the Android SDK; add the Android 17 platform to it.
      - name: Install Android 17 SDK platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37" "build-tools;36.0.0" || echo "::warning::sdkmanager could not install android-37; AGP will try"

      - uses: gradle/actions/setup-gradle@v4

      - name: Core engine tests
        run: .github/scripts/gradle.sh :core:test

      - name: App unit and Robolectric tests
        run: .github/scripts/gradle.sh :app:testDebugUnitTest

      - name: Lint
        run: .github/scripts/gradle.sh :app:lintDebug

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.TYST_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tyst.jks"
          echo "TYST_KEYSTORE_FILE=$RUNNER_TEMP/tyst.jks" >> "$GITHUB_ENV"

      - name: Build APKs (fails if any network permission sneaks in)
        env:
          TYST_KEYSTORE_PASSWORD: ${{ secrets.TYST_KEYSTORE_PASSWORD }}
          TYST_KEY_ALIAS: ${{ secrets.TYST_KEY_ALIAS }}
          TYST_KEY_PASSWORD: ${{ secrets.TYST_KEY_PASSWORD }}
        run: .github/scripts/gradle.sh :app:assembleDebug :app:assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: tyst-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            core/build/reports/
            app/build/reports/
          if-no-files-found: ignore

  emulator:
    name: End-to-end on emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android 17 SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37" "build-tools;36.0.0" || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: .github/scripts/gradle.sh :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: .github/scripts/gradle.sh :app:connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
