name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.TYST_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The runner image ships the Android SDK; add the Android 17 platform to it.
      - name: Install Android 17 SDK platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37" "build-tools;36.0.0" || echo "::warning::sdkmanager could not install android-37; AGP will try"

      - uses: gradle/actions/setup-gradle@v4

      - name: Core engine tests
        run: .github/scripts/gradle.sh :core:test

      - name: App unit and Robolectric tests
        run: .github/scripts/gradle.sh :app:testDebugUnitTest

      - name: Lint
        run: .github/scripts/gradle.sh :app:lintDebug

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.TYST_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tyst.jks"
          echo "TYST_KEYSTORE_FILE=$RUNNER_TEMP/tyst.jks" >> "$GITHUB_ENV"

      - name: Build APKs (fails if any network permission sneaks in)
        env:
          TYST_KEYSTORE_PASSWORD: ${{ secrets.TYST_KEYSTORE_PASSWORD }}
          TYST_KEY_ALIAS: ${{ secrets.TYST_KEY_ALIAS }}
          TYST_KEY_PASSWORD: ${{ secrets.TYST_KEY_PASSWORD }}
        run: .github/scripts/gradle.sh :app:assembleDebug :app:assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: tyst-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            core/build/reports/
            app/build/reports/
          if-no-files-found: ignore

  emulator:
    name: End-to-end on emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android 17 SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37" "build-tools;36.0.0" || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: .github/scripts/gradle.sh :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: .github/scripts/gradle.sh :app:connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore

  release:
    name: Publish GitHub release
    # Publishes the version named in release.txt when main is pushed (or a v* tag / release appears),
    # once, after all checks pass. Change release.txt to ship a new version.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    needs: [build, emulator]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # SHA-256 of Tyst's permanent release certificate. A build signed with anything else is not published.
      EXPECTED_CERT_SHA256: e0254296 6f3878c8 08b307c7 86746d12 8eea91a5 6c0de6b7 9bfc63a8 861b919a
    steps:
      - uses: actions/checkout@v5

      - name: Which version
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"; else tag="$(tr -d ' \n' < release.txt)"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "TYST_VERSION_NAME=${tag#v}" >> "$GITHUB_ENV"
          if gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '\.apk$'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Already released::$tag already has an APK. Change release.txt to publish a new version."
          fi

      - uses: actions/setup-java@v5
        if: steps.tag.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        if: steps.tag.outputs.skip != 'true'

      - name: Install Android 17 SDK platform
        if: steps.tag.outputs.skip != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37" "build-tools;36.0.0" || true

      - name: Load the release key
        if: steps.tag.outputs.skip != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.TYST_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TYST_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error title=Release key missing::Add the TYST_KEYSTORE_BASE64 and TYST_KEYSTORE_PASSWORD repository secrets (Settings > Secrets and variables > Actions), then re-run this job."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tyst.jks"
          echo "TYST_KEYSTORE_FILE=$RUNNER_TEMP/tyst.jks" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        if: steps.tag.outputs.skip != 'true'
        env:
          TYST_KEYSTORE_PASSWORD: ${{ secrets.TYST_KEYSTORE_PASSWORD }}
        run: .github/scripts/gradle.sh :app:assembleRelease

      - name: Check the signature and package the release
        if: steps.tag.outputs.skip != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          apk=app/build/outputs/apk/release/app-release.apk
          certs="$("$apksigner" verify --print-certs "$apk")"
          echo "$certs"
          got="$(echo "$certs" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')"
          want="$(echo "$EXPECTED_CERT_SHA256" | tr -d ' ')"
          if [ "$got" != "$want" ]; then
            echo "::error title=Wrong signing key::APK is signed by $got, expected $want"
            exit 1
          fi
          mkdir -p dist
          cp "$apk" "dist/tyst-$TAG.apk"
          (cd dist && sha256sum "tyst-$TAG.apk" > "tyst-$TAG.apk.sha256")

      - name: Publish the release
        if: steps.tag.outputs.skip != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            notes="docs/releases/$TAG.md"
            [ -f "$notes" ] || notes=/dev/null
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Tyst $TAG" --notes-file "$notes" --latest
          fi
          echo "::notice title=Released::https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
